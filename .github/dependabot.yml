version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/mockserver"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "java"
    groups:
      maven-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Future Java floor or namespace migrations may add ignores here.
      # The javax → jakarta block was removed when the codebase migrated.
      # checkstyle 13.x requires Java 21 runtime; we target Java 17.
      # Pin the ceiling below 13.0.0 — this is stricter than ignoring only
      # semver-major bumps and keeps us on the Java-17-compatible 12.x line.
      - dependency-name: "com.puppycrawl.tools:checkstyle"
        versions: [">=13.0.0"]
      # Infinispan 15.x requires Java 21 runtime; we target Java 17.
      # Pin the ceiling below 15.0.0 to stay on the Java-17-compatible 14.0.x line.
      - dependency-name: "org.infinispan:infinispan-core"
        versions: [">=15.0.0"]
      # No ignore is needed for io.netty:netty-tcnative-boringssl-static. It carries no
      # version anywhere in the poms - netty-bom governs the base artifact and every
      # per-platform classifier together - so Dependabot has nothing to bump and cannot
      # reintroduce a pin. Bumping netty.version moves tcnative transitively in lockstep,
      # and the Docker native download derives its version from the jar's
      # META-INF/mockserver-tcnative.version stamp. The old standalone ignore existed
      # because an explicit override let the base artifact diverge from the classifiers
      # and break dependencyConvergence (PR #2332); that override is gone.
      # graphql-java 22.x-24.x ship Java 11 bytecode and run on the Java 17 floor.
      # A future major could raise the runtime floor, so ceiling-pin below the next
      # unreleased major (25.x): minor/patch bumps on the 22.x-24.x line auto-update,
      # but a major must be manually verified to still build/run on Java 17 first.
      - dependency-name: "com.graphql-java:graphql-java"
        versions: [">=25.0.0"]

  - package-ecosystem: "maven"
    directory: "/mockserver/mockserver-maven-plugin"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
      - "maven-plugin"
    groups:
      maven-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # checkstyle 13.x requires Java 21 runtime; we target Java 17.
      # Pin the ceiling below 13.0.0 — this is stricter than ignoring only
      # semver-major bumps and keeps us on the Java-17-compatible 12.x line.
      - dependency-name: "com.puppycrawl.tools:checkstyle"
        versions: [">=13.0.0"]
      # netty-tcnative-boringssl-static is version-locked to Netty (see the /mockserver
      # ecosystem above) — bumping it independently breaks dependencyConvergence (PR #2332).
      - dependency-name: "io.netty:netty-tcnative-boringssl-static"

  # The healthy npm directories share one grouped job. mockserver-vscode is
  # split into its own block below so a failure there (e.g. an EOVERRIDE while
  # regenerating its lockfile) can no longer abort PR creation for these three.
  # /.opencode was removed from this list: it has no tracked package.json (only
  # an orphan package-lock.json), so Dependabot could never resolve it — the
  # lockfile has been untracked instead.
  - package-ecosystem: "npm"
    directories:
      - "/mockserver-ui"
      - "/mockserver-client-node"
      - "/mockserver-node"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7.x is blocked by typescript-eslint, whose peer range is
      # `typescript >=4.8.4 <6.1.0`. `npm ci` fails with ERESOLVE before lint or
      # typecheck can run, so the bump cannot pass the UI gate no matter what
      # else moves — nothing else in the tree raises that ceiling. TypeScript 7
      # is the new native-compiler major and typescript-eslint support for it is
      # a large piece of upstream work with no committed date.
      #
      # REVISIT when typescript-eslint publishes a release whose peer range
      # admits typescript 7 (watch https://github.com/typescript-eslint/typescript-eslint).
      # At that point remove this ignore and bump both together — typescript
      # alone will still fail. PR #2547 was closed under this rule.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # mockserver-vscode in its own block so one bad directory cannot take down the
  # healthy npm directories above. The @types/vscode ignore is vscode-specific.
  - package-ecosystem: "npm"
    directory: "/mockserver-vscode"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @types/vscode's MINOR version is the VS Code API level, so it is not a
      # routine minor bump: vsce refuses to package an extension whose
      # @types/vscode exceeds engines.vscode. Raising it is a deliberate decision
      # to drop support for older VS Code, which belongs with an engines.vscode
      # change, not a dependency sweep. Bumped 1.80.0 -> 1.125.0 inside the
      # minor-and-patch group in #21d7ae412; compile stayed green because this is
      # a vsce rule rather than a tsc one, and it surfaced only when the release
      # packaged the extension, leaving 7.6.0 without a VS Code release.
      # Ceiling matches engines.vscode ^1.80.0.
      - dependency-name: "@types/vscode"
        versions: [">=1.81.0"]

  - package-ecosystem: "pip"
    directory: "/mockserver-client-python"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      pip-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bundler"
    directories:
      - "/mockserver-client-ruby"
      - "/jekyll-www.mock-server.com"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ruby"
    groups:
      bundler-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/docker"
      - "/docker/root"
      - "/docker/root-snapshot"
      - "/docker/snapshot"
      - "/docker/graaljs"
      - "/docker/local"
      - "/docker/webhook"
      - "/docker/clustered"
      - "/docker_build/maven"
      - "/docker_build/performance"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "terraform"
    directories:
      - "/terraform/buildkite-agents"
      - "/terraform/buildkite-pipelines"
      - "/terraform/ses-email-forwarding"
      - "/terraform/website"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "terraform"
    groups:
      terraform-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
