# winget manifest — singleton format (combined version + defaultLocale + installer).
# Submitted to https://github.com/microsoft/winget-pkgs via PR (wingetcreate).
#
# Publishes the self-contained MockServer CLI bundle (a zip that carries its own
# trimmed Java runtime, so no separate JVM install is required). winget treats it
# as a `zip` installer whose nested `portable` launcher (bin\mockserver.bat) is
# exposed on PATH as `mockserver`.

PackageIdentifier: MockServer.MockServer
PackageVersion: "${VERSION}"
PackageLocale: en-US
Publisher: MockServer
PublisherUrl: https://www.mock-server.com
PublisherSupportUrl: https://github.com/mock-server/mockserver-monorepo/issues
PackageName: MockServer
PackageUrl: https://github.com/mock-server/mockserver-monorepo
License: Apache-2.0
LicenseUrl: https://github.com/mock-server/mockserver-monorepo/blob/master/LICENSE.md
ShortDescription: Mock, proxy & record HTTP(S), gRPC, and async messaging for testing
Description: |-
  MockServer is an open-source HTTP(S) mock server and proxy for testing.
  It can mock any system you integrate with via HTTP or HTTPS, proxy requests
  to record and playback, and verify requests have been made.
Tags:
  - mock
  - proxy
  - testing
  - http
  - grpc
  - api
Moniker: mockserver
ManifestType: singleton
ManifestVersion: 1.9.0
Installers:
  # Only x64 Windows bundles are published today (build-all-bundles.sh targets
  # windows/x86_64). Add an arm64 entry here if/when a windows/aarch64 bundle is
  # added to the release.
  - Architecture: x64
    InstallerType: zip
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: mockserver-${VERSION}-windows-x86_64\bin\mockserver.bat
        PortableCommandAlias: mockserver
    InstallerUrl: https://github.com/mock-server/mockserver-monorepo/releases/download/mockserver-${VERSION}/mockserver-${VERSION}-windows-x86_64.zip
    InstallerSha256: "${SHA256_WINDOWS_X86_64}"
