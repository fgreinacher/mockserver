# SDKMAN! candidate metadata for MockServer CLI.
#
# SDKMAN! does not use a file-based manifest — candidates are registered and
# updated via the SDKMAN! Vendor API (https://sdkman.io/vendors). This file
# documents the candidate configuration for reference; the actual registration
# is performed by scripts/release/components/sdkman.sh.
#
# The URLs point at the self-contained MockServer bundles (each carries its own
# trimmed Java runtime — no separate JVM install required). SDKMAN unpacks the
# archive and puts its `bin/` on PATH, exposing the `mockserver` launcher.

candidate: mockserver
name: MockServer
description: "Mock, proxy & record HTTP(S), gRPC, and async messaging for testing"
website: https://www.mock-server.com
distribution: PLATFORM_SPECIFIC

# Platform mappings — SDKMAN uses these identifiers:
#   LINUX_64, LINUX_ARM64, MAC_OSX, MAC_ARM64, WINDOWS_64
platforms:
  LINUX_64:
    url: https://github.com/mock-server/mockserver-monorepo/releases/download/mockserver-${VERSION}/mockserver-${VERSION}-linux-x86_64.tar.gz
    checksum: ${SHA256_LINUX_X86_64}
  LINUX_ARM64:
    url: https://github.com/mock-server/mockserver-monorepo/releases/download/mockserver-${VERSION}/mockserver-${VERSION}-linux-aarch64.tar.gz
    checksum: ${SHA256_LINUX_AARCH64}
  MAC_OSX:
    url: https://github.com/mock-server/mockserver-monorepo/releases/download/mockserver-${VERSION}/mockserver-${VERSION}-darwin-x86_64.tar.gz
    checksum: ${SHA256_DARWIN_X86_64}
  MAC_ARM64:
    url: https://github.com/mock-server/mockserver-monorepo/releases/download/mockserver-${VERSION}/mockserver-${VERSION}-darwin-aarch64.tar.gz
    checksum: ${SHA256_DARWIN_AARCH64}
  WINDOWS_64:
    url: https://github.com/mock-server/mockserver-monorepo/releases/download/mockserver-${VERSION}/mockserver-${VERSION}-windows-x86_64.zip
    checksum: ${SHA256_WINDOWS_X86_64}
