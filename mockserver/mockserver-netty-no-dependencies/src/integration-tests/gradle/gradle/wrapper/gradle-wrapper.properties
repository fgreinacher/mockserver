distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Use the -bin distribution: this CI integration test only runs `gradlew test`,
# it never needs the sources/docs/samples that the -all distribution bundles for
# IDE code-completion. -bin is ~131MB vs ~214MB for -all, so this removes ~87MB
# from the download that happens on every CI build (the agent's GRADLE_USER_HOME
# is ephemeral and the distribution is not cached between builds).
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip
# networkTimeout is the wrapper's per-read socket timeout. The previous wrapper
# was pre-7.6 and hard-coded it to 10000ms; a 10s stall on the Gradle CDN during
# the distribution download is what caused the intermittent
# "SocketTimeoutException: Read timed out" build failures. 60000ms (6x the
# default) tolerates transient CDN slowness without hanging forever on a dead
# connection.
networkTimeout=60000
# retries/retryBackOffMs re-attempt the DISTRIBUTION DOWNLOAD only (handled in
# the wrapper's Install step, before the Gradle build/tests ever run) so a
# dropped connection is retried rather than failing the whole 25-minute reactor.
# This retry can never mask a test failure.
retries=3
retryBackOffMs=1000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# Pins the exact distribution artifact. Published by Gradle as gradle-8.14-bin.zip.sha256.
# The wrapper refuses to run if the downloaded zip does not match, so a substituted or
# corrupted distribution fails the build instead of executing.
distributionSha256Sum=61ad310d3c7d3e5da131b76bbf22b5a4c0786e9d892dae8c1658d4b484de3caa
