# SLF4J Simple provider configuration for this module's tests.
#
# S3ExpectationPersistenceReloadTest runs a full in-process MockServer, whose MockServerLogger
# routes every log line through SLF4J. INFO for org.mockserver keeps the restore diagnostics
# (the "timed out after N second(s)" WARN and the "no persisted expectations found ... under key"
# INFO) in the CI log, which is what makes a red Docker-gated run diagnosable.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.org.mockserver=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showShortLogName=true
