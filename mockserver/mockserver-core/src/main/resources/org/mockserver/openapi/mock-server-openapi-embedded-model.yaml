openapi: 3.0.0
servers:
  - url: 'http://localhost:1080/'
  - url: 'https://localhost:1080/'
info:
  title: MockServer API
  version: 7.4.0
  description: >-
    MockServer enables easy mocking of any system you integrate with via HTTP or HTTPS with clients written in Java, JavaScript and Ruby and a simple REST API (as shown below).


    MockServer Proxy is a proxy that introspects all proxied traffic including encrypted SSL traffic and supports Port Forwarding, Web Proxying (i.e. HTTP proxy), HTTPS Tunneling Proxying (using HTTP CONNECT) and SOCKS Proxying (i.e. dynamic port forwarding).


    Both MockServer and the MockServer Proxy record all received requests so that it is possible to verify exactly what requests have been sent by the system under test.


    MockServer also supports AI integration via MCP (Model Context Protocol), enabling AI agents and LLM-powered tools to programmatically create expectations, verify requests, and manage mock server state.
  license:
    url: 'https://github.com/mock-server/mockserver-monorepo/blob/master/LICENSE.md'
    name: Apache 2.0
tags:
  - name: expectation
    description: Create or update expectations - updates if the id matches an existing expectations (only supported by MockServer)
  - name: verify
    description: Verify requests (both MockServer & MockServer Proxy)
  - name: control
    description: Manage state or process (both MockServer & MockServer Proxy)

paths:
  /mockserver/expectation:
    put:
      tags:
        - expectation
      summary: create expectation
      responses:
        '201':
          description: expectations created
          content:
            application/json:
              schema:
                description: "list of upserted expectations"
                type: array
                additionalProperties: false
                items:
                  $ref: "#/components/schemas/Expectation"
        '400':
          description: incorrect request format
        '406':
          description: invalid expectation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Expectations"
        description: expectation(s) to create
        required: true
  /mockserver/openapi:
    put:
      tags:
        - expectation
      summary: create expectations from OpenAPI or Swagger
      responses:
        '201':
          description: expectations created
          content:
            application/json:
              schema:
                description: "list of upserted expectations"
                type: array
                additionalProperties: false
                items:
                  $ref: "#/components/schemas/Expectation"
        '400':
          description: incorrect request format
        '406':
          description: invalid expectation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAPIExpectations"
          application/yaml:
            schema:
              $ref: "#/components/schemas/OpenAPIExpectations"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/OpenAPIExpectations"
        description: expectation(s) to create
        required: true
  /mockserver/oidc:
    put:
      tags:
        - expectation
      operationId: mockOidcProvider
      summary: generate a turnkey OIDC / OAuth2 provider
      description: >-
        Generates a set of expectations that emulate an OpenID Connect / OAuth2 provider (discovery document,
        JWKS, token, authorize, userinfo and related endpoints) and adds them. An empty body uses the default
        provider configuration.
      responses:
        '201':
          description: OIDC provider expectations created
          content:
            application/json:
              schema:
                description: "list of upserted expectations"
                type: array
                additionalProperties: false
                items:
                  $ref: "#/components/schemas/Expectation"
        '400':
          description: incorrect request format
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: OIDC provider configuration; an empty body uses defaults
              properties:
                issuer:
                  type: string
                  description: issuer URL advertised in the discovery document and token claims
                clientId:
                  type: string
                  description: OAuth2 client identifier
                clientSecret:
                  type: string
                  writeOnly: true
                  description: OAuth2 client secret
                privateKeyPem:
                  type: string
                  writeOnly: true
                  description: PEM-encoded signing private key (never serialized back in responses)
                scopes:
                  type: array
                  items:
                    type: string
                  description: supported OAuth2 / OIDC scopes
                tokenExpirySeconds:
                  type: integer
                  description: lifetime of issued access tokens in seconds
        description: OIDC provider configuration
        required: false
  /mockserver/saml:
    put:
      tags:
        - expectation
      operationId: mockSamlProvider
      summary: generate a turnkey SAML identity provider
      description: >-
        Generates a set of expectations that emulate a SAML 2.0 identity provider (metadata, single sign-on and
        single logout endpoints) and adds them. An empty body uses the default provider configuration.
      responses:
        '201':
          description: SAML provider expectations created
          content:
            application/json:
              schema:
                description: "list of upserted expectations"
                type: array
                additionalProperties: false
                items:
                  $ref: "#/components/schemas/Expectation"
        '400':
          description: incorrect request format
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: SAML provider configuration; an empty body uses defaults
              properties:
                idpEntityId:
                  type: string
                  description: identity provider entity ID advertised in metadata
                spEntityId:
                  type: string
                  description: service provider entity ID the assertions are issued for
                signingCertificatePem:
                  type: string
                  description: PEM-encoded X.509 certificate used to verify signed assertions
                signingPrivateKeyPem:
                  type: string
                  writeOnly: true
                  description: PEM-encoded private key used to sign assertions
        description: SAML provider configuration
        required: false
  /mockserver/scim:
    put:
      tags:
        - expectation
      operationId: mockScimProvider
      summary: generate a turnkey SCIM provisioning provider
      description: >-
        Generates a set of expectations that emulate a SCIM 2.0 provisioning provider (Users, Groups and
        ServiceProviderConfig endpoints) and adds them. An empty body uses the default provider configuration.
      responses:
        '201':
          description: SCIM provider expectations created
          content:
            application/json:
              schema:
                description: "list of upserted expectations"
                type: array
                additionalProperties: false
                items:
                  $ref: "#/components/schemas/Expectation"
        '400':
          description: incorrect request format
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: SCIM provider configuration; an empty body uses defaults
              properties:
                basePath:
                  type: string
                  description: base path the SCIM endpoints are served under
                requireBearerToken:
                  type: boolean
                  description: whether requests must present a bearer token
                expectedBearerToken:
                  type: string
                  writeOnly: true
                  description: bearer token that incoming requests must present when required
        description: SCIM provider configuration
        required: false
  /mockserver/clear:
    put:
      tags:
        - control
      summary: clears expectations and recorded requests that match the request matcher
      responses:
        '200':
          description: expectations and recorded requests cleared
        '400':
          description: incorrect request format
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [ "all", "log", "expectations" ]
            default: "all"
          required: false
          description: specifies the type of information to clear, default if not specified is "all", supported values are "all", "log", "expectations"
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/RequestDefinition"
                - $ref: "#/components/schemas/ExpectationId"
        description: request used to match expectations and record requests to clear
  /mockserver/reset:
    put:
      tags:
        - control
      summary: clears all expectations and recorded requests
      responses:
        '200':
          description: expectations and recorded requests cleared
  /mockserver/retrieve:
    put:
      tags:
        - control
      summary: retrieve recorded requests, active expectations, recorded expectations or log messages
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [ "java", "javascript", "python", "go", "csharp", "ruby", "rust", "php", "json", "log_entries", "har", "openapi", "postman", "bruno", "curl" ]
          required: false
          description: changes response format, default if not specified is "json", supported values are "java", "javascript", "python", "go", "csharp", "ruby", "rust", "php", "json", "log_entries", "har", "openapi", "postman", "bruno", "curl"
        - in: query
          name: type
          schema:
            type: string
            enum: [ "logs", "requests", "request_responses", "recorded_expectations", "active_expectations" ]
          required: false
          description: specifies the type of object that is retrieve, default if not specified is "requests", supported values are "logs", "requests", "recorded_expectations", "active_expectations"
      responses:
        '200':
          description: recorded requests or active expectations returned
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    additionalProperties: false
                    items:
                      $ref: "#/components/schemas/Expectation"
                  - type: array
                    additionalProperties: false
                    items:
                      $ref: "#/components/schemas/HttpRequest"
                  - type: array
                    additionalProperties: false
                    items:
                      $ref: "#/components/schemas/HttpRequestAndHttpResponse"
            application/java:
              schema:
                type: string
                description: Java code for the list of either Expectations or HttpResponses
            text/plain:
              schema:
                type: string
                description: List of recorded log messages
        '400':
          description: incorrect request format
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestDefinition"
        description: >-
          request used to match which recorded requests, expectations or log messages to return, an empty body matches all requests, expectations or log messages
  /mockserver/verify:
    put:
      tags:
        - verify
      summary: verify a request has been received a specific number of times
      responses:
        '202':
          description: matching request has been received specified number of times
        '400':
          description: incorrect request format
        '406':
          description: request has not been received specified numbers of times
          content:
            text/plain:
              schema:
                type: string
                description: 'JUnit expected:<...> but was:<...> format'
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Verification"
        description: request matcher and the number of times to match
        required: true
  /mockserver/verifySequence:
    put:
      tags:
        - verify
      summary: verify a sequence of request has been received in the specific order
      responses:
        '202':
          description: request sequence has been received in specified order
        '400':
          description: incorrect request format
        '406':
          description: request sequence has not been received in specified order
          content:
            text/plain:
              schema:
                type: string
                description: 'JUnit expected:<...> but was:<...> format'
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationSequence"
        description: the sequence of requests matchers
        required: true
  /mockserver/status:
    put:
      tags:
        - control
      summary: return listening ports
      responses:
        '200':
          description: MockServer is running and listening on the listed ports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ports"
  /mockserver/bind:
    put:
      tags:
        - control
      summary: bind additional listening ports
      description: only supported on Netty version
      responses:
        '200':
          description: >-
            listening on additional requested ports, note: the response ony
            contains ports added for the request, to list all ports use /status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ports"
        '400':
          description: incorrect request format
        '406':
          description: >-
            unable to bind to ports (i.e. already bound or JVM process doesn't
            have permission)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Ports"
        description: >-
          list of ports to bind to, where 0 indicates dynamically bind to any
          available port
        required: true
  /mockserver/openapi.yaml:
    get:
      tags:
        - control
      summary: retrieve the OpenAPI specification for MockServer
      description: returns the OpenAPI specification describing the MockServer REST API in YAML format
      responses:
        '200':
          description: OpenAPI specification returned
          content:
            application/yaml:
              schema:
                type: string
                description: OpenAPI specification in YAML format
  /mockserver/stop:
    put:
      tags:
        - control
      summary: stop running process
      description: only supported on Netty version
      responses:
        '200':
          description: MockServer process is stopping
components:
  schemas:
    Expectations:
      description: "list of expectations"
      oneOf:
        - $ref: "#/components/schemas/Expectation"
        - type: array
          additionalProperties: false
          items:
            $ref: "#/components/schemas/Expectation"
    Expectation:
      description: "expectation"
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        priority:
          type: integer
        percentage:
          type: integer
          minimum: 0
          maximum: 100
        chaos:
          $ref: "#/components/schemas/HttpChaosProfile"
        rateLimit:
          $ref: "#/components/schemas/RateLimit"
        httpRequest:
          $ref: "#/components/schemas/RequestDefinition"
        httpResponse:
          $ref: "#/components/schemas/HttpResponse"
        httpResponseTemplate:
          $ref: "#/components/schemas/HttpTemplate"
        httpResponseClassCallback:
          $ref: "#/components/schemas/HttpClassCallback"
        httpResponseObjectCallback:
          $ref: "#/components/schemas/HttpObjectCallback"
        httpForward:
          $ref: "#/components/schemas/HttpForward"
        httpForwardTemplate:
          $ref: "#/components/schemas/HttpTemplate"
        httpForwardClassCallback:
          $ref: "#/components/schemas/HttpClassCallback"
        httpForwardObjectCallback:
          $ref: "#/components/schemas/HttpObjectCallback"
        httpOverrideForwardedRequest:
          $ref: "#/components/schemas/HttpOverrideForwardedRequest"
        httpError:
          $ref: "#/components/schemas/HttpError"
        httpSseResponse:
          $ref: "#/components/schemas/HttpSseResponse"
        httpWebSocketResponse:
          $ref: "#/components/schemas/HttpWebSocketResponse"
        times:
          $ref: "#/components/schemas/Times"
        timeToLive:
          $ref: "#/components/schemas/TimeToLive"
        namespace:
          type: string
          description: optional namespace (tenant) this expectation belongs to; when set, the expectation only matches requests carrying the configured matchNamespaceHeader with this value, isolated from other namespaces
        scenarioName:
          type: string
        scenarioState:
          type: string
        newScenarioState:
          type: string
        httpResponses:
          type: array
          items:
            $ref: "#/components/schemas/HttpResponse"
        responseMode:
          enum:
            - SEQUENTIAL
            - RANDOM
            - WEIGHTED
            - SWITCH
        responseWeights:
          type: array
          items:
            type: integer
            minimum: 1
        switchAfter:
          type: integer
          minimum: 1
        crossProtocolScenarios:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              trigger:
                enum:
                  - DNS_QUERY
                  - WEBSOCKET_CONNECT
                  - GRPC_REQUEST
                  - HTTP_REQUEST
              matchPattern:
                type: string
              scenarioName:
                type: string
              targetState:
                type: string
            required:
              - trigger
              - scenarioName
              - targetState
      oneOf:
        - required:
            - httpResponse
        - required:
            - httpResponseTemplate
        - required:
            - httpResponseClassCallback
        - required:
            - httpResponseObjectCallback
        - required:
            - httpForward
        - required:
            - httpForwardTemplate
        - required:
            - httpForwardClassCallback
        - required:
            - httpForwardObjectCallback
        - required:
            - httpOverrideForwardedRequest
        - required:
            - httpError
        - required:
            - httpSseResponse
        - required:
            - httpWebSocketResponse
        - required:
            - httpResponses
    ExpectationId:
      description: "pointer to existing expectation"
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
      required:
        - id
    OpenAPIExpectations:
      description: "list of open api expectations"
      oneOf:
        - $ref: "#/components/schemas/OpenAPIExpectation"
        - type: array
          additionalProperties: false
          items:
            $ref: "#/components/schemas/OpenAPIExpectation"
    OpenAPIExpectation:
      description: "open api or swagger expectation"
      type: object
      additionalProperties: false
      properties:
        specUrlOrPayload:
          anyOf:
            - type: string
            - type: object
        operationsAndResponses:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: object
                properties:
                  statusCode:
                    type: string
                  exampleName:
                    type: string
                required:
                  - statusCode
        contextPathPrefix:
          type: string
      required:
        - specUrlOrPayload
    RequestDefinition:
      description: "request definition"
      oneOf:
        - $ref: "#/components/schemas/HttpRequest"
        - $ref: "#/components/schemas/OpenAPIDefinition"
    HttpRequest:
      description: "request properties matcher"
      type: object
      additionalProperties: false
      properties:
        not:
          type: boolean
        secure:
          type: boolean
        keepAlive:
          type: boolean
        respondBeforeBody:
          type: boolean
          description: "If true, MockServer responds to a matching request before consuming its body and may close the connection. Required: the matcher must not specify a body matcher, and the action must be RESPONSE or ERROR."
        method:
          $ref: "#/components/schemas/StringOrJsonSchema"
        path:
          $ref: "#/components/schemas/StringOrJsonSchema"
        pathParameters:
          $ref: "#/components/schemas/KeyToMultiValue"
        queryStringParameters:
          $ref: "#/components/schemas/KeyToMultiValue"
        body:
          $ref: "#/components/schemas/Body"
        headers:
          $ref: "#/components/schemas/KeyToMultiValue"
        cookies:
          $ref: "#/components/schemas/KeyToValue"
        socketAddress:
          $ref: "#/components/schemas/SocketAddress"
        protocol:
          $ref: "#/components/schemas/Protocol"
    OpenAPIDefinition:
      description: "open api or swagger request matcher"
      type: object
      additionalProperties: false
      properties:
        not:
          type: boolean
        specUrlOrPayload:
          anyOf:
            - type: string
            - type: object
        operationId:
          type: string
        contextPathPrefix:
          type: string
    HttpResponse:
      description: "response to return"
      type: object
      additionalProperties: false
      properties:
        delay:
          $ref: "#/components/schemas/Delay"
        body:
          $ref: "#/components/schemas/BodyWithContentType"
        cookies:
          $ref: "#/components/schemas/KeyToValue"
        connectionOptions:
          $ref: "#/components/schemas/ConnectionOptions"
        headers:
          $ref: "#/components/schemas/KeyToMultiValue"
        trailers:
          $ref: "#/components/schemas/KeyToMultiValue"
        statusCode:
          type: integer
        statusCodeRange:
          type: string
        reasonPhrase:
          type: string
        recoverAfter:
          $ref: "#/components/schemas/RecoverAfter"
    HttpTemplate:
      description: "template to generate response / request"
      type: object
      additionalProperties: false
      properties:
        delay:
          $ref: "#/components/schemas/Delay"
        templateType:
          enum:
            - VELOCITY
            - JAVASCRIPT
            - MUSTACHE
        template:
          type: string
        templateFile:
          type: string
        responseOverride:
          $ref: "#/components/schemas/HttpResponse"
        responseModifier:
          type: object
          additionalProperties: false
          properties:
            headers:
              type: object
              additionalProperties: false
              properties:
                add:
                  "$ref": "#/components/schemas/KeyToMultiValue"
                replace:
                  "$ref": "#/components/schemas/KeyToMultiValue"
                remove:
                  type: array
                  additionalProperties: false
                  items:
                    type: string
            cookies:
              type: object
              additionalProperties: false
              properties:
                add:
                  "$ref": "#/components/schemas/KeyToValue"
                replace:
                  "$ref": "#/components/schemas/KeyToValue"
                remove:
                  type: array
                  additionalProperties: false
                  items:
                    type: string
    HttpForward:
      description: "host and port to forward to"
      type: object
      additionalProperties: false
      properties:
        delay:
          $ref: "#/components/schemas/Delay"
        host:
          type: string
        port:
          type: integer
        scheme:
          enum:
            - HTTP
            - HTTPS
    HttpClassCallback:
      description: "class callback"
      type: object
      additionalProperties: false
      properties:
        delay:
          $ref: "#/components/schemas/Delay"
        callbackClass:
          type: string
    HttpObjectCallback:
      description: "object / method callback"
      type: object
      additionalProperties: false
      properties:
        delay:
          $ref: "#/components/schemas/Delay"
        clientId:
          type: string
        responseCallback:
          type: boolean
    HttpOverrideForwardedRequest:
      description: "override forwarded request"
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            delay:
              "$ref": "#/components/schemas/Delay"
            requestOverride:
              "$ref": "#/components/schemas/HttpRequest"
            requestModifier:
              type: object
              additionalProperties: false
              properties:
                path:
                  type: object
                  additionalProperties: false
                  properties:
                    regex:
                      type: string
                    substitution:
                      type: string
                queryStringParameters:
                  type: object
                  additionalProperties: false
                  properties:
                    add:
                      "$ref": "#/components/schemas/KeyToMultiValue"
                    replace:
                      "$ref": "#/components/schemas/KeyToMultiValue"
                    remove:
                      type: array
                      additionalProperties: false
                      items:
                        type: string
                headers:
                  type: object
                  additionalProperties: false
                  properties:
                    add:
                      "$ref": "#/components/schemas/KeyToMultiValue"
                    replace:
                      "$ref": "#/components/schemas/KeyToMultiValue"
                    remove:
                      type: array
                      additionalProperties: false
                      items:
                        type: string
                cookies:
                  type: object
                  additionalProperties: false
                  properties:
                    add:
                      "$ref": "#/components/schemas/KeyToValue"
                    replace:
                      "$ref": "#/components/schemas/KeyToValue"
                    remove:
                      type: array
                      additionalProperties: false
                      items:
                        type: string
            responseOverride:
              "$ref": "#/components/schemas/HttpResponse"
            responseModifier:
              type: object
              additionalProperties: false
              properties:
                headers:
                  type: object
                  additionalProperties: false
                  properties:
                    add:
                      "$ref": "#/components/schemas/KeyToMultiValue"
                    replace:
                      "$ref": "#/components/schemas/KeyToMultiValue"
                    remove:
                      type: array
                      additionalProperties: false
                      items:
                        type: string
                cookies:
                  type: object
                  additionalProperties: false
                  properties:
                    add:
                      "$ref": "#/components/schemas/KeyToValue"
                    replace:
                      "$ref": "#/components/schemas/KeyToValue"
                    remove:
                      type: array
                      additionalProperties: false
                      items:
                        type: string
            responseTemplate:
              "$ref": "#/components/schemas/HttpTemplate"
        - type: object
          additionalProperties: false
          properties:
            delay:
              "$ref": "#/components/schemas/Delay"
            httpRequest:
              "$ref": "#/components/schemas/HttpRequest"
            httpResponse:
              "$ref": "#/components/schemas/HttpResponse"
    HttpError:
      description: "error behaviour"
      type: object
      additionalProperties: false
      properties:
        delay:
          $ref: "#/components/schemas/Delay"
        dropConnection:
          type: boolean
          description: "drop the connection; ignored when streamError is set (streamError takes precedence)"
        responseBytes:
          type: string
        streamError:
          type: integer
          format: int64
          description: "reset the matched request stream with this error code (HTTP/2 RST_STREAM / HTTP/3 RESET_STREAM) instead of returning a response; HTTP/1.1 has no stream concept so this falls back to dropping the connection"
    HttpSseResponse:
      description: "SSE response to return"
      type: object
      additionalProperties: false
      properties:
        delay:
          $ref: "#/components/schemas/Delay"
        headers:
          $ref: "#/components/schemas/KeyToMultiValue"
        statusCode:
          type: integer
        events:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              event:
                type: string
              data:
                type: string
              id:
                type: string
              retry:
                type: integer
              delay:
                $ref: "#/components/schemas/Delay"
        closeConnection:
          type: boolean
    HttpWebSocketResponse:
      description: "WebSocket response to return"
      type: object
      additionalProperties: false
      properties:
        delay:
          $ref: "#/components/schemas/Delay"
        subprotocol:
          type: string
        messages:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              text:
                type: string
              binary:
                type: string
                format: byte
              delay:
                $ref: "#/components/schemas/Delay"
        closeConnection:
          type: boolean
    Times:
      description: "number of responses"
      type: object
      additionalProperties: false
      properties:
        remainingTimes:
          type: integer
        unlimited:
          type: boolean
    TimeToLive:
      description: "time expectation is valid for"
      type: object
      additionalProperties: false
      properties:
        timeUnit:
          enum:
            - DAYS
            - HOURS
            - MINUTES
            - SECONDS
            - MILLISECONDS
            - MICROSECONDS
            - NANOSECONDS
        timeToLive:
          type: integer
        unlimited:
          type: boolean
    KeyToMultiValue:
      oneOf:
        - type: array
          additionalProperties: false
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
              values:
                type: array
                additionalProperties: false
                items:
                  type: string
        - type: object
          additionalProperties: true
          properties:
            keyMatchStyle:
              type: string
              enum:
                - MATCHING_KEY
                - SUB_SET
              default: SUB_SET
          # patternProperties:
          #   "^(?!keyMatchStyle)\\S+$":
          #     oneOf:
          #     - type: array
          #       additionalProperties: false
          #       items:
          #         $ref: "#/components/schemas/StringOrJsonSchema"
          #     - type: object
          #       additionalProperties: false
          #       properties:
          #         parameterStyle:
          #           type: string
          #           enum:
          #           - SIMPLE
          #           - SIMPLE_EXPLODED
          #           - LABEL
          #           - LABEL_EXPLODED
          #           - MATRIX
          #           - MATRIX_EXPLODED
          #           - FORM_EXPLODED
          #           - FORM
          #           - SPACE_DELIMITED_EXPLODED
          #           - SPACE_DELIMITED
          #           - PIPE_DELIMITED_EXPLODED
          #           - PIPE_DELIMITED
          #           - DEEP_OBJECT
          #           default: ''
          #         values:
          #           type: array
          #           additionalProperties: false
          #           items:
          #             $ref: "#/components/schemas/StringOrJsonSchema"
    KeyToValue:
      oneOf:
        - type: array
          additionalProperties: false
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
        - type: object
          additionalProperties: true
          # patternProperties:
          #   "^\\S+$":
          #     $ref: "#/components/schemas/StringOrJsonSchema"
    StringOrJsonSchema:
      description: "string value that can be support nottable, optional or a json schema"
      oneOf:
        - type: string
        - type: object
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            value:
              type: string
            schema:
              $ref: http://json-schema.org/draft-04/schema
            parameterStyle:
              type: string
              enum:
                - SIMPLE
                - SIMPLE_EXPLODED
                - LABEL
                - LABEL_EXPLODED
                - MATRIX
                - MATRIX_EXPLODED
                - FORM_EXPLODED
                - FORM
                - SPACE_DELIMITED_EXPLODED
                - SPACE_DELIMITED
                - PIPE_DELIMITED_EXPLODED
                - PIPE_DELIMITED
                - DEEP_OBJECT
    SocketAddress:
      description: "remote address to send request to, only used for request overrides"
      type: object
      additionalProperties: false
      properties:
        host:
          type: string
        port:
          type: integer
        scheme:
          enum:
            - HTTP
            - HTTPS
    Protocol:
      description: "protocol matcher"
      enum:
        - HTTP_1_1
        - HTTP_2
        - HTTP_3
    Body:
      description: "request body matcher"
      anyOf:
        - type: object
          description: "binary body matcher"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - BINARY
            base64Bytes:
              type: string
            contentType:
              type: string
        - type: object
          description: "json body matcher"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - JSON
            json:
              type: string
            contentType:
              type: string
            matchType:
              enum:
                - STRICT
                - ONLY_MATCHING_FIELDS
            matchNumbersAsStrings:
              type: boolean
        - type: object
          description: "json matching fields body matcher"
          additionalProperties: true
        - type: object
          description: "json schema body matcher"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - JSON_SCHEMA
            jsonSchema:
              $ref: http://json-schema.org/draft-04/schema
        - type: object
          description: "JSON path body matcher"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - JSON_PATH
            jsonPath:
              type: string
        - type: object
          description: "parameter body matcher"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - PARAMETERS
            parameters:
              $ref: "#/components/schemas/KeyToMultiValue"
        - type: object
          description: "multipart form-data body matcher"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - MULTIPART
            fields:
              $ref: "#/components/schemas/KeyToMultiValue"
            filenames:
              $ref: "#/components/schemas/KeyToMultiValue"
            partContentTypes:
              $ref: "#/components/schemas/KeyToMultiValue"
        - type: object
          description: "regex body matcher"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - REGEX
            regex:
              type: string
        - type: object
          description: "string body matcher"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - STRING
            string:
              type: string
            contentType:
              type: string
            subString:
              type: boolean
        - type: string
          description: "substring body matcher"
        - type: object
          description: "xml body matcher"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - XML
            xml:
              type: string
            contentType:
              type: string
        - type: object
          description: "xml schema body matcher"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - XML_SCHEMA
            xmlSchema:
              type: string
        - type: object
          description: "xpath body matcher"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - XPATH
            xpath:
              type: string
        - type: object
          description: "JSON-RPC body matcher"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - JSON_RPC
            method:
              type: string
            paramsSchema:
              type: string
        - type: object
          description: "GraphQL body matcher"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - GRAPHQL
            query:
              type: string
            operationName:
              type: string
            variablesSchema:
              type: string
          required:
            - type
            - query
    BodyWithContentType:
      description: "response body"
      anyOf:
        - type: object
          description: "binary response body"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - BINARY
            base64Bytes:
              type: string
            contentType:
              type: string
        - type: object
          description: "json response body"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - JSON
            json:
              type: string
            contentType:
              type: string
        - type: object
          description: "json response body"
          additionalProperties: true
        - type: object
          description: "string response body"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - STRING
            string:
              type: string
            contentType:
              type: string
        - type: string
          description: "string response body"
        - type: object
          description: "xml response body"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - XML
            xml:
              type: string
            contentType:
              type: string
        - type: object
          description: "file response body — served from a file, optionally rendered as a template against the request"
          additionalProperties: false
          properties:
            not:
              type: boolean
            optional:
              type: boolean
            type:
              enum:
                - FILE
            filePath:
              type: string
            templateType:
              enum:
                - VELOCITY
                - MUSTACHE
            contentType:
              type: string
    HttpChaosProfile:
      description: "declarative HTTP chaos/fault injection profile for mocked responses"
      type: object
      additionalProperties: false
      properties:
        errorStatus:
          type: integer
          minimum: 100
          maximum: 599
        retryAfter:
          type: string
          maxLength: 100
        errorProbability:
          type: number
          minimum: 0.0
          maximum: 1.0
        dropConnectionProbability:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Probability (0.0 to 1.0) of dropping the TCP connection without sending any response
        latency:
          $ref: "#/components/schemas/Delay"
        seed:
          type: integer
          format: int64
        succeedFirst:
          type: integer
          minimum: 0
        failRequestCount:
          type: integer
          minimum: 1
        outageAfterMillis:
          type: integer
          format: int64
          minimum: 0
          description: "Time-based outage window: chaos becomes active this many milliseconds after the expectation's first match (measured via the controllable clock)"
        outageDurationMillis:
          type: integer
          format: int64
          minimum: 1
          description: "Time-based outage window: chaos stays active for this many milliseconds then self-heals; omit for an unbounded outage"
        truncateBodyAtFraction:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: "Corrupt the response body by keeping only this leading fraction (0.0 to 1.0) of its bytes"
        malformedBody:
          type: boolean
          description: "Corrupt the response body by appending a broken-JSON fragment so it fails to parse"
        slowResponseChunkSize:
          type: integer
          minimum: 1
          description: "Dribble the response body in chunks of this many bytes; requires slowResponseChunkDelay to slow the response"
        slowResponseChunkDelay:
          $ref: "#/components/schemas/Delay"
        quotaName:
          type: string
          description: "Stateful quota: shared counter key; expectations with the same quotaName share one rate-limit counter"
        quotaLimit:
          type: integer
          minimum: 1
          description: "Stateful quota: max requests allowed per window before requests are rejected"
        quotaWindowMillis:
          type: integer
          format: int64
          minimum: 1
          description: "Stateful quota: fixed-window length in milliseconds"
        quotaErrorStatus:
          type: integer
          minimum: 100
          maximum: 599
          description: "Stateful quota: status returned when the quota is exceeded (default 429)"
        degradationRampMillis:
          type: integer
          format: int64
          minimum: 1
          description: "Gradual degradation: ramp errorProbability and dropConnectionProbability linearly from 0 to their configured values over this many milliseconds from the first match"
    RateLimit:
      description: "declarative protocol-agnostic rate limit / quota"
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: "Shared counter key; expectations with the same name share one rate-limit counter. When omitted the expectation id is used as the key"
        algorithm:
          type: string
          enum:
            - fixed_window
            - token_bucket
          description: "Rate-limiting algorithm; defaults to fixed_window"
        limit:
          type: integer
          minimum: 1
          description: "fixed_window: maximum requests allowed per window before requests are rejected"
        windowMillis:
          type: integer
          minimum: 1
          description: "fixed_window: fixed-window length in milliseconds"
        burst:
          type: integer
          minimum: 1
          description: "token_bucket: bucket capacity in tokens"
        refillPerSecond:
          type: number
          exclusiveMinimum: 0
          description: "token_bucket: token refill rate per second"
        errorStatus:
          type: integer
          minimum: 100
          maximum: 599
          description: "Status returned when the request is over-limit (default 429)"
        retryAfter:
          type: string
          maxLength: 100
          description: "Literal Retry-After header value; when omitted it is computed from the window/bucket reset time"
    Delay:
      description: "response delay"
      type: object
      additionalProperties: false
      properties:
        timeUnit:
          type: string
        value:
          type: integer
        template:
          type: string
          description: "opt-in template rendered against the request whose output is parsed as a millisecond delay (e.g. respond more slowly for larger payloads); falls back to value/timeUnit on a non-numeric or blank result"
        templateType:
          type: string
          description: "template engine used to evaluate the delay template; only VELOCITY and MUSTACHE are supported"
          enum:
            - VELOCITY
            - MUSTACHE
        distribution:
          type: object
          additionalProperties: false
          description: "distribution for variable delays: UNIFORM requires min and max, LOG_NORMAL requires median and p99, GAUSSIAN requires mean and stdDev"
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - UNIFORM
                - LOG_NORMAL
                - GAUSSIAN
            min:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
            median:
              type: integer
              minimum: 1
            p99:
              type: integer
              minimum: 1
            mean:
              type: integer
              minimum: 0
            stdDev:
              type: integer
              minimum: 0
    RecoverAfter:
      description: "fail the first failTimes matches then serve the configured response (deterministic retry/backoff recovery primitive)"
      type: object
      additionalProperties: false
      properties:
        failTimes:
          type: integer
          description: "number of leading matches that serve the failure response before the configured response is served; null or <= 0 makes this inert"
        failResponse:
          $ref: "#/components/schemas/HttpResponse"
        idempotencyHeader:
          type: string
          description: "optional request header whose value keys an independent failure window per (expectation, header-value); when absent on a request the per-expectation match count is used"
    ConnectionOptions:
      description: "connection options"
      type: object
      additionalProperties: false
      properties:
        suppressContentLengthHeader:
          type: boolean
        contentLengthHeaderOverride:
          type: integer
        suppressConnectionHeader:
          type: boolean
        chunkSize:
          type: integer
        keepAliveOverride:
          type: boolean
        closeSocket:
          type: boolean
        closeSocketDelay:
          $ref: "#/components/schemas/Delay"
    Verification:
      description: "verification"
      type: object
      additionalProperties: false
      properties:
        expectationId:
          $ref: "#/components/schemas/ExpectationId"
        httpRequest:
          $ref: "#/components/schemas/RequestDefinition"
        httpResponse:
          $ref: "#/components/schemas/HttpResponse"
        times:
          $ref: "#/components/schemas/VerificationTimes"
        maximumNumberOfRequestToReturnInVerificationFailure:
          type: integer
      oneOf:
        - required:
            - expectationId
        - required:
            - httpRequest
        - required:
            - httpResponse
          not:
            anyOf:
              - required:
                  - expectationId
              - required:
                  - httpRequest
    VerificationTimes:
      description: "number of request to verify"
      type: object
      additionalProperties: false
      properties:
        atLeast:
          type: integer
        atMost:
          type: integer
    VerificationSequence:
      description: "verification sequence"
      type: object
      additionalProperties: false
      properties:
        expectationIds:
          type: array
          additionalProperties: false
          items:
            $ref: "#/components/schemas/ExpectationId"
        httpRequests:
          type: array
          items:
            $ref: "#/components/schemas/RequestDefinition"
        httpResponses:
          type: array
          items:
            $ref: "#/components/schemas/HttpResponse"
        maximumNumberOfRequestToReturnInVerificationFailure:
          type: integer
      oneOf:
        - required:
            - expectationIds
        - required:
            - httpRequests
        - required:
            - httpResponses
          not:
            anyOf:
              - required:
                  - expectationIds
              - required:
                  - httpRequests
    Ports:
      description: "list of ports"
      type: object
      additionalProperties: false
      properties:
        ports:
          items:
            type: number
          type: array
    HttpRequestAndHttpResponse:
      description: "request and response"
      type: object
      additionalProperties: false
      properties:
        httpRequest:
          $ref: "#/components/schemas/HttpRequest"
        httpResponse:
          $ref: "#/components/schemas/HttpResponse"
        timestamp:
          type: string