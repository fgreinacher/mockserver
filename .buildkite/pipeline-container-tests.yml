steps:
  - label: ":bash: validate container integration test scripts"
    command: ".buildkite/scripts/steps/container-tests-validate.sh"
    timeout_in_minutes: 5
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2

  # Build the real Docker image (source=copy) and prove it works — the arch-correct
  # tcnative .so is baked in, the NATIVE TLS provider actually loads in the image
  # JVM (OpenSsl.isAvailable), and the container starts and serves a real TLS
  # handshake. Runs on EVERY branch (not master-only): a docker/**-only change now
  # routes here (generate-pipeline.sh), so a broken Dockerfile/stamp is caught on the
  # PR instead of shipping unbuilt. The script builds the server jars on demand (in
  # the mockserver/mockserver:maven image when the agent has no host JDK) and cleans
  # up the staged jar + ca-bundle.pem it creates. Needs host Docker, so queue:default.
  - label: ":docker: build & verify image (source=copy + native tcnative + TLS)"
    command: ".buildkite/scripts/steps/docker-build-verify.sh"
    timeout_in_minutes: 40
    agents:
      queue: default
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2

  - label: ":helm: Helm integration tests (k3d)"
    command: ".buildkite/scripts/steps/helm-integration-test.sh"
    timeout_in_minutes: 15
    depends_on: ~
    agents:
      queue: default
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2
